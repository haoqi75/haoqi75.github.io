<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · 页面未找到</title>
    <link rel="icon" href="{{favicon}}" />
    <link inline href="css/main.css" rel="stylesheet" />
</head>
<body>
    <div class="container" role="main" aria-label="404 错误页面">
        <!-- 幽灵图标 -->
        <div class="ghost-wrapper" aria-hidden="true">
            <div class="ghost">
                <span class="ghost-smile"></span>
                <div class="ghost-wave">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <h1 class="error-code">404</h1>
        <h2 class="title">页面迷路了</h2>
        <p class="subtitle">
            抱歉，我们找不到您要访问的页面。<br />
            它可能已被移动、删除，或者从未存在过。<br />
            不妨 <a href="/">返回首页</a> 重新开始？
        </p>

        <div class="btn-group">
            <a href="/" class="btn">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path d="M12 4L4 12l2 2 6-6 6 6 2-2-8-8z"/>
                    <path d="M4 12v8h16v-8h-2v6H6v-6H4z"/>
                </svg>
                返回首页
            </a>
            <a href="https://github.com" class="btn btn-outline" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.03-2.682-.103-.253-.446-1.27.098-2.646 0 0 .84-.269 2.75 1.025.8-.223 1.65-.334 2.5-.334.85 0 1.7.111 2.5.334 1.91-1.294 2.75-1.025 2.75-1.025.544 1.376.201 2.393.099 2.646.64.698 1.03 1.591 1.03 2.682 0 3.841-2.337 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
                GitHub
            </a>
        </div>

        <div class="footer">
            <span>© 2026 · 404 页面</span>
            <span class="dot">•</span>
            <a href="/">首页</a>
            <span class="dot">•</span>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
            <span class="dot">•</span>
            <a href="#" onclick="history.back(); return false;">返回上一页</a>
        </div>
    </div>
    <script inline src="js/main.js"></script>
</body>
</html>
